version: 2
sources:
  - name: stripe
    database: dbt-tutorial
    schema: stripe
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _batched_at
    tables:
      - name: payment
        identifier: payment
        description: "This table contains all payments made by customers."
        columns:
          - name: id
            description: "The unique identifier for each payment."
            tests:
              - unique
              - not_null
          - name: order_id
            description: "The unique identifier for the order associated with the payment."
          - name:  paymentmethod
            description: "The method used for the payment (e.g., 'credit_card', 'paypal')."
          - name: status
            description: "The status of the payment (e.g., 'succeeded', 'pending')."
          - name: amount
            description: "The amount paid."
          - name : created
            description: "The timestamp when the payment was created."
          - name: _batched_at
            description: "The timestamp when the payment was batched."