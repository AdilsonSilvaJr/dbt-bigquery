version: 2
sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _etl_loaded_at


    tables:
      - name: orders
        identifier: orders
        description: "This table contains all orders placed by customers."
        columns:
          - name: id
            description: "The unique identifier for each order."
            tests:
              - unique
              - not_null
          - name: user_id
            description: "The unique identifier for the user who placed the order."
          - name: order_date
            description: "The date when the order was placed."
          - name: status
            description: "The status of the order (e.g., 'completed', 'pending')."
          - name: _etl_loaded_at
            description: "The timestamp when the order was loaded into the system."
      - name: customers
        identifier: customers
        description: "This table contains all customers who have placed orders."
        freshness: null
        columns:
          - name: id
            description: "The unique identifier for each customer."
            tests:
              - unique
              - not_null
          - name: first_name
            description: "The first name of the customer."
          - name: last_name
            description: "The last name of the customer."
